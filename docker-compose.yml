# =============================================================================
# JudgeLoom — Development Docker Compose
# =============================================================================
# Full local development stack:
#   web           — Django dev server (auto-reload, source mounted)
#   celery_worker — Celery task worker
#   celery_beat   — Periodic task scheduler
#   redis         — Broker + cache + channel layer
#   postgres      — Primary database
#   flower        — Celery task monitor UI
#   go-judge      — sandbox execution service
#   judge-worker  — pull-based judge worker
# =============================================================================

services:

  # ─── Infrastructure ──────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: judgeloom
      POSTGRES_USER: judgeloom
      POSTGRES_PASSWORD: judgeloom
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judgeloom -d judgeloom"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Application ─────────────────────────────────────────────────────────

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://judgeloom:judgeloom@postgres:5432/judgeloom
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CHANNEL_LAYERS_URL: redis://redis:6379/2
    ports:
      - "8000:8000"
    volumes:
      # Mount source so edits are reflected immediately without rebuilding
      - .:/app
      # Persist media uploads across restarts
      - media_files:/var/judgeloom/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python manage.py runserver 0.0.0.0:8000

  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://judgeloom:judgeloom@postgres:5432/judgeloom
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CHANNEL_LAYERS_URL: redis://redis:6379/2
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker --loglevel=info --concurrency=4

  celery_beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://judgeloom:judgeloom@postgres:5432/judgeloom
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CHANNEL_LAYERS_URL: redis://redis:6379/2
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # --scheduler is already configured via CELERY_BEAT_SCHEDULER in Django settings
    command: celery -A config beat --loglevel=info

  flower:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      CELERY_BROKER_URL: redis://redis:6379/1
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A config flower --port=5555 --broker=redis://redis:6379/1

  go-judge:
    build:
      context: .
      dockerfile: docker/Dockerfile.gojudge
    restart: unless-stopped
    privileged: true
    shm_size: 256m
    ports:
      - "127.0.0.1:5050:5050"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5050/version >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  judge-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    environment:
      JUDGELOOM_API_URL: http://web:8000/api/v1
      JUDGELOOM_JUDGE_TOKEN: ${JUDGELOOM_JUDGE_TOKEN:-change-me}
      JUDGELOOM_JUDGE_NAME: ${JUDGELOOM_JUDGE_NAME:-judge-worker-1}
      GO_JUDGE_URL: http://go-judge:5050
      WORKER_LANGUAGES: ${WORKER_LANGUAGES:-PY3,CPP17}
      WORKER_CACHE_DIR: /var/lib/judgeloom-worker
      WORKER_POLL_INTERVAL: 2s
      WORKER_HEARTBEAT: 10s
    volumes:
      - worker_cache:/var/lib/judgeloom-worker
    depends_on:
      web:
        condition: service_started
      go-judge:
        condition: service_healthy

# ─── Volumes ───────────────────────────────────────────────────────────────

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  media_files:
    driver: local
  worker_cache:
    driver: local
