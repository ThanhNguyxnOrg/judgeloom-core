# =============================================================================
# JudgeLoom — Dependabot Configuration
# =============================================================================
# Keeps dependencies up-to-date by opening weekly PRs.
# Docs: https://docs.github.com/en/code-security/dependabot
# =============================================================================

version: 2
updates:
  # ─── Python (pip) ────────────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/requirements"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      django:
        patterns:
          - "django*"
          - "channels*"
      lint-and-typing:
        patterns:
          - "ruff*"
          - "mypy*"
          - "django-stubs*"
          - "celery-types*"
          - "types-*"
      testing:
        patterns:
          - "pytest*"
          - "coverage*"
          - "factory-boy*"
          - "freezegun*"
      celery:
        patterns:
          - "celery*"
          - "redis*"
          - "kombu*"

  # ─── GitHub Actions ──────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(deps)"
      include: "scope"

  # ─── Docker ──────────────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "build(docker)"
      include: "scope"
