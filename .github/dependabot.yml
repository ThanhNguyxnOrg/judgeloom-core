# =============================================================================
# JudgeLoom — Dependabot Configuration
# =============================================================================
# Strategy: keep dependencies fresh with as few PRs as possible.
# - Group everything aggressively into a small number of PRs per ecosystem.
# - Dependabot auto-supersedes outdated PRs with the latest version, so we
#   never need to "fix up" a stale 1.1.x PR when 1.2.0 lands.
# Auto-merge for safe (patch / minor / dev) bumps is handled by
# .github/workflows/dependabot-auto-merge.yml.
# Docs: https://docs.github.com/en/code-security/dependabot
# =============================================================================

version: 2
updates:
  # ─── Python (pip) ────────────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/requirements"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      python-production:
        # All non-dev runtime deps in a single weekly PR per update-type
        applies-to: version-updates
        dependency-type: "production"
        patterns:
          - "*"
      python-development:
        applies-to: version-updates
        dependency-type: "development"
        patterns:
          - "*"
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  # ─── GitHub Actions ──────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    groups:
      github-actions-all:
        patterns:
          - "*"

  # ─── Docker ──────────────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "build(docker)"
      include: "scope"
    groups:
      docker-all:
        patterns:
          - "*"
