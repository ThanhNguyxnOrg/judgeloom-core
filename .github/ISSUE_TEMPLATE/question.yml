name: ❓ Question / Help
description: Ask a question about JudgeLoom usage, configuration, or behaviour.
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        For open-ended discussions or "how do I…" questions, [GitHub Discussions](https://github.com/ThanhNguyxnOrg/judgeloom-core/discussions) is usually a better fit. Use this template for questions that may turn into actionable docs or bug fixes.

  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do? What have you already tried?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Versions, configuration, error messages, or anything else relevant.
