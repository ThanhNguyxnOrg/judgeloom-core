name: ✨ Feature request
description: Suggest a new feature or enhancement for JudgeLoom.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing an improvement! The more context you can give, the easier it is to evaluate and prioritise.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I have searched the [existing issues](https://github.com/ThanhNguyxnOrg/judgeloom-core/issues?q=is%3Aissue) and have not found a duplicate request.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve? Why is the current behaviour insufficient?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like this to work? Include API sketches, UI mockups, or code samples if relevant.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches you've thought about and why you didn't pick them.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that helps frame the request — links, screenshots, prior art, etc.
